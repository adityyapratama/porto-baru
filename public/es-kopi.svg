<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none" role="img" aria-label="Iced milk coffee with a straw"><style>
.straw,.lid,.cup,.ice{transform-box:view-box}
.lid{animation:lid 5.2s infinite both}
